<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- full-bleed square for iOS home screen / Android maskable: the OS cuts its own shape;
       the artwork is scaled into the central safe zone -->
  <rect width="64" height="64" fill="#1d2833"/>
  <g transform="translate(32 32) scale(0.78) translate(-32 -32)">
    <rect x="11" y="12" width="7" height="18" rx="2.5" fill="#4b8fe2"/>
    <rect x="23" y="13" width="30" height="6" rx="3" fill="#eef3f8"/>
    <rect x="23" y="23" width="19" height="6" rx="3" fill="#eef3f8" fill-opacity="0.62"/>
    <rect x="11" y="34" width="7" height="18" rx="2.5" fill="#36b37a"/>
    <rect x="23" y="35" width="25" height="6" rx="3" fill="#eef3f8"/>
    <rect x="23" y="45" width="30" height="6" rx="3" fill="#eef3f8" fill-opacity="0.62"/>
  </g>
</svg>
